<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Connect Home Assistant</title>
<link rel="stylesheet" href="/assets/google-tv/shared/common.css" data-sections="reset">
<link rel="stylesheet" href="/assets/google-tv/pages/setup-phone/setup-phone.css">
</head>
<body>
<main id="form">
  <!-- docs/logo/rootedtv.svg without its tile. -->
  <svg class="mark" viewBox="84 72 344 352" role="img" aria-label="Rooted TV" translate="no"><rect x="108" y="200" width="296" height="200" rx="48" fill="none" stroke="currentColor" stroke-width="38"/><path d="M256 200 V150" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round"/><path d="M252 156 C214 158 186 134 180 96 C220 94 248 118 252 156 Z M260 146 C268 102 300 76 344 78 C344 122 312 148 260 146 Z" fill="currentColor"/><circle cx="256" cy="300" r="26" fill="currentColor"/></svg>
  <h1>Connect Home Assistant</h1>
  <p class="sub">The details of your MQTT broker. With the Mosquitto add-on, the address is your Home Assistant's own.</p>

  <label for="host">Broker address</label>
  <input id="host" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.10" translate="no" required>

  <label for="port">Port</label>
  <input id="port" type="number" inputmode="numeric" value="1883" min="1" max="65535">

  <label for="user">Username</label>
  <input id="user" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">

  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="off">

  <label class="check"><input id="tls" type="checkbox"> <span>Encrypted connection (TLS)</span></label>
  <p class="note">Only if your broker is set up for it. Usually on port 8883.</p>

  <button id="save" type="button">Connect</button>
  <p id="msg" role="status"></p>
</main>

<main id="done" class="done" hidden>
  <h1>Sent to the TV</h1>
  <p class="sub">It's connecting now and will show the result on screen. You can close this page.</p>
</main>

<script src="/assets/google-tv/shared/common.js"></script>
<script src="/assets/google-tv/pages/setup-phone/setup-phone.js"></script>
</body>
</html>
