<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rooted TV</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/dashboard-app/assets/icon130.png">
<link rel="stylesheet" href="/assets/google-tv/shared/common.css" data-sections="tokens fonts reset base list tabs chip overlay">
<link rel="stylesheet" href="/assets/google-tv/pages/dashboard/dashboard.css">
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="clock">--:--</div>
    <!-- docs/logo/rootedtv.svg without its tile. -->
    <svg id="mark" viewBox="84 72 344 352" role="img" aria-label="Rooted TV" translate="no"><rect x="108" y="200" width="296" height="200" rx="48" fill="none" stroke="currentColor" stroke-width="38"/><path d="M256 200 V150" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round"/><path d="M252 156 C214 158 186 134 180 96 C220 94 248 118 252 156 Z M260 146 C268 102 300 76 344 78 C344 122 312 148 260 146 Z" fill="currentColor"/><circle cx="256" cy="300" r="26" fill="currentColor"/></svg>
  </div>
  <nav id="tabs" class="gt-tabs idle"></nav>
  <div id="main">
    <div id="list">
      <div id="msg"></div>
      <div class="more" id="moreUp">&#9650;</div>
      <div id="rows"></div>
      <div class="more" id="moreDown">&#9660;</div>
    </div>
    <aside id="hint">
      <div class="h-title" id="hintTitle"></div>
      <div class="h-body" id="hintBody"></div>
      <div class="h-act" id="hintAct"></div>
      <div class="h-qr" id="hintQr"><svg id="hintQrSvg" viewBox="0 0 33 33" shape-rendering="crispEdges"></svg><div class="h-url" id="hintUrl"></div></div>
    </aside>
  </div>
  <div id="flash" class="gt-snackbar"></div>
</div>
<script src="/assets/google-tv/shared/qr.js"></script>
<script src="/assets/google-tv/shared/common.js"></script>
<script src="/assets/google-tv/pages/dashboard/dashboard.js"></script>
</body>
</html>
