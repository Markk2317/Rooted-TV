site_name: Rooted TV
site_description: "Google TV's Home, native on rooted LG webOS TVs, with a dashboard, privacy controls and a Home Assistant MQTT bridge: turn off ACR and ads, debloat apps, protect OLED panels."
site_url: https://markk2317.github.io/Rooted-TV/
site_author: Rooted TV contributors
repo_url: https://github.com/Markk2317/Rooted-TV
repo_name: Markk2317/Rooted-TV
edit_uri: edit/main/docs/
copyright: MIT licence. Rooted TV is not affiliated with or endorsed by LG Electronics.
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: logo/rootedtv.svg
  favicon: logo/rootedtv-512.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light theme }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark theme }
  # Google Sans Flex comes from docs/assets/fonts (stylesheets/rooted-tv.css), not Google Fonts.
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting started:
      - Installing: getting-started/install.md
      - Tested TVs: getting-started/tested-tvs.md
      - Updating and uninstalling: getting-started/managing.md
  - The dashboard:
      - dashboard/index.md
      - Control: dashboard/control.md
      - Metrics: dashboard/metrics.md
      - Apps: dashboard/apps.md
      - Home: dashboard/home.md
      - Privacy: dashboard/privacy.md
      - OLED Care: dashboard/oled-care.md
      - Game: dashboard/game.md
      - Screen savers: dashboard/screen-savers.md
      - Advanced Controls: dashboard/advanced.md
      - Service menu: dashboard/service-menu.md
      - Server: dashboard/server.md
      - Tools: dashboard/tools.md
  - The TV app:
      - A tour of Rooted TV Home: apps/launcher.md
      - The TV app: apps/tv-app.md
  - Integrations:
      - Home Assistant:
          - Overview: integrations/home-assistant.md
          - Entities: integrations/home-assistant-entities.md
          - Remote button events: integrations/home-assistant-remote-buttons.md
      - Prometheus metrics: integrations/prometheus.md
      - Log forwarding (syslog): integrations/syslog.md
  - Privacy and administration:
      - Privacy policy: privacy-policy.md
      - Security: administration/security.md
      - What LG's ACR does: administration/acr.md
      - What it changes on the TV: administration/tv-changes.md
      - Network time (NTP): administration/ntp.md
      - Experimental features: administration/experimental.md
  - Development:
      - Contributing: development/contributing.md
      - Internals: development/implementation.md
      - Testing and CI: development/testing.md
      - Roadmap: development/roadmap.md
      - TV research: development/tv-research.md
      - TV hardware specifications:
          - development/tv-specs/index.md
          - LG B3 (OLED65B3PUA): development/tv-specs/b3.md
          - LG B8 (OLED65B8SLC): development/tv-specs/b8.md
          - LG C9 (OLED65C97LA): development/tv-specs/c9.md
          - LG CX (OLED48CXPUB): development/tv-specs/cx.md
          - LG C2 (OLED42C24LA): development/tv-specs/c2.md
          - LG C5 (OLED48C5PUA): development/tv-specs/c5.md
          - LG UA73 (55UA73006LA): development/tv-specs/ua73.md
          - LG NU80 (43NU800BPSC): development/tv-specs/nu80.md
      - Strings: development/strings.md
      - Material 3 Expressive: development/material-3-expressive.md
      - Performance:
          - Audit: development/performance-audit.md
          - Baseline: development/performance-baseline.md
          - Optimizations: development/performance-optimizations.md
          - Benchmarks: development/performance-benchmarks.md

# Template overrides are not pages.
exclude_docs: |
  /overrides/

extra_css:
  - stylesheets/rooted-tv.css

extra_javascript:
  - javascripts/tvbar.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Markk2317/Rooted-TV
      name: Rooted TV on GitHub

markdown_extensions:
  - github-callouts
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  anchors: warn
  unrecognized_links: warn
